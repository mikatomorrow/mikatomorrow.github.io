    /* ── objects ── */
    .toaster {

    /* ── speed classes: toasters flap wings + fly, toast just flies ── */
    .t1  { -webkit-animation: flap .2s steps(4) infinite alternate,         fly 10s linear infinite;
                   animation: flap .2s steps(4) infinite alternate,         fly 10s linear infinite; }
    .t2  { -webkit-animation: flap .2s steps(4) infinite alternate-reverse, fly 16s linear infinite;
                   animation: flap .2s steps(4) infinite alternate-reverse, fly 16s linear infinite; }

                   animation: flap .2s steps(4) infinite alternate,         fly 10s 5s  linear infinite; }
    .t5  { -webkit-animation: flap .2s steps(4) infinite alternate-reverse, fly 24s 4s  linear infinite;

    .tst1 { -webkit-animation: fly 10s linear infinite;      animation: fly 10s linear infinite; }

    .tst3 { -webkit-animation: fly 24s linear infinite;      animation: fly 24s linear infinite; }

    @-webkit-keyframes fly {

<script>
(function() {
  var el = document.getElementById('fake-cursor');
  document.documentElement.style.cursor = 'none';
  document.body.style.cursor = 'none';
  document.addEventListener('mousemove', function(e) {
    el.style.transform = 'translate('+e.clientX+'px,'+e.clientY+'px)';
    el.style.display = 'block';
  });
  document.addEventListener('mouseleave', function() { el.style.display = 'none'; });
  document.addEventListener('mouseenter', function() { el.style.display = 'block'; });
})();
</script>
