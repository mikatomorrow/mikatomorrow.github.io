<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>mikatomorrow :: weather</title>
  <style type="text/css">

    html, body, * { cursor: none !important; }
    html, body { margin: 0; padding: 0; height: 100%; }

    #fake-cursor {
      position: fixed; top: 0; left: 0;
      width: 48px; height: 48px;
      pointer-events: none; z-index: 99999;
      background: url('cursor-dino.png') no-repeat top left;
      background-size: 48px 48px;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }

    body {
      background: #000;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-direction: column;
      flex-direction: column;
    }

    #topbar {
      background-color: #080808;
      border-bottom: 2px solid #111111;
      border-left: 4px solid #1188cc;
      padding: 7px 20px;
      display: -ms-flexbox;
      display: flex;
      -ms-flex-align: center;
      align-items: center;
      gap: 24px;
      -ms-flex-negative: 0;
      flex-shrink: 0;
    }

    #topbar .breadcrumb {
      font-family: "Courier New", Courier, monospace;
      font-size: 9px; color: #333333; letter-spacing: 2px;
    }
    #topbar .breadcrumb a { color: #225577; text-decoration: none; }
    #topbar .breadcrumb a:hover { color: #1188cc; }

    #topbar .title {
      font-family: Impact, "Arial Narrow", Arial, sans-serif;
      font-size: 16px; font-weight: normal;
      color: #1188cc; letter-spacing: 6px;
      text-transform: lowercase;
    }

    /* wrapper so the overlay can be positioned relative to the iframe area */
    #iframe-wrap {
      -ms-flex: 1;
      flex: 1;
      position: relative;
    }

    #weather-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* transparent overlay — captures mousemove for the fake cursor,
       steps aside on mousedown/wheel so clicks and scrolls reach the iframe */
    #iframe-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 5;
      background: transparent;
    }

    #clippy-wrap {
      position: fixed; bottom: 24px; right: 28px;
      width: 124px; height: 93px;
      z-index: 999; pointer-events: none;
    }
    #clippy-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  </style>
</head>
<body>

  <div id="topbar">
    <span class="breadcrumb"><a href="plaza.html">&#8592; plaza</a> &nbsp;/&nbsp; weather</span>
    <span class="title">&#9729; weather</span>
  </div>

  <div id="iframe-wrap">
    <iframe id="weather-frame"
      src="https://weatherstar.netbymatt.com/"
      title="WeatherStar 4000+">
    </iframe>
    <div id="iframe-overlay"></div>
  </div>

<div id="fake-cursor"></div>

<div id="clippy-wrap">
  <canvas id="clippy-canvas" width="124" height="93"></canvas>
</div>

<script>
(function() {
  var FW = 124, FH = 93;
  var seq = [], i;
  for (i = 10; i < 26; i++) seq.push([i, 29]);
  for (i = 0;  i < 24; i++) seq.push([i, 30]);

  var canvas = document.getElementById('clippy-canvas');
  var ctx = canvas.getContext('2d'), sheet = null, frame = 0;

  function tick() {
    if (!sheet) return;
    var f = seq[frame % seq.length];
    ctx.clearRect(0, 0, FW, FH);
    ctx.drawImage(sheet, f[0]*FW, f[1]*FH, FW, FH, 0, 0, FW, FH);
    frame++;
  }

  var img = new Image();
  img.onload = function() {
    var oc = document.createElement('canvas');
    oc.width = img.width; oc.height = img.height;
    var oct = oc.getContext('2d');
    oct.drawImage(img, 0, 0);
    var id = oct.getImageData(0, 0, oc.width, oc.height), d = id.data;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j] > 200 && d[j+1] < 60 && d[j+2] > 200) d[j+3] = 0;
    }
    oct.putImageData(id, 0, 0);
    sheet = oc; tick(); setInterval(tick, 130);
  };
  img.src = 'clippy.png';
})();

(function() {
  var cursor = document.getElementById('fake-cursor');
  var overlay = document.getElementById('iframe-overlay');

  function moveCursor(e) {
    cursor.style.transform = 'translate('+e.clientX+'px,'+e.clientY+'px)';
    cursor.style.display = 'block';
  }

  // track cursor on normal page areas
  document.addEventListener('mousemove', moveCursor);
  document.addEventListener('mouseleave', function() { cursor.style.display = 'none'; });
  document.addEventListener('mouseenter', function() { cursor.style.display = 'block'; });

  // track cursor over the iframe via the overlay
  overlay.addEventListener('mousemove', moveCursor);

  // step aside on click so the iframe receives it, restore on mouseup
  overlay.addEventListener('mousedown', function() {
    overlay.style.pointerEvents = 'none';
  });
  document.addEventListener('mouseup', function() {
    overlay.style.pointerEvents = 'auto';
  });

  // step aside on scroll so the iframe receives the wheel event
  overlay.addEventListener('wheel', function() {
    overlay.style.pointerEvents = 'none';
    setTimeout(function() { overlay.style.pointerEvents = 'auto'; }, 200);
  });

  document.documentElement.style.cursor = 'none';
  document.body.style.cursor = 'none';
})();
</script>

</body>
</html>
