  title="WeatherStar 4000+"
  scrolling="no">

<div id="clippy-wrap">
  <canvas id="clippy-canvas" width="124" height="93"></canvas>
</div>

<script>
(function() {
  var FW = 124, FH = 93;
  var seq = [], i;
  for (i = 10; i < 26; i++) seq.push([i, 29]);
  for (i = 0;  i < 24; i++) seq.push([i, 30]);

  var canvas = document.getElementById('clippy-canvas');
  var ctx = canvas.getContext('2d'), sheet = null, frame = 0;

  function tick() {
    if (!sheet) return;
    var f = seq[frame % seq.length];
    ctx.clearRect(0, 0, FW, FH);
    ctx.drawImage(sheet, f[0]*FW, f[1]*FH, FW, FH, 0, 0, FW, FH);
    frame++;
  }

  var img = new Image();
  img.onload = function() {
    var oc = document.createElement('canvas');
    oc.width = img.width; oc.height = img.height;
    var oct = oc.getContext('2d');
    oct.drawImage(img, 0, 0);
    var id = oct.getImageData(0, 0, oc.width, oc.height), d = id.data;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j] > 200 && d[j+1] < 60 && d[j+2] > 200) d[j+3] = 0;
    }
    oct.putImageData(id, 0, 0);
    sheet = oc; tick(); setInterval(tick, 130);
  };
  img.src = 'img/clippy.png';
})();
</script>
