<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>mikatomorrow :: weather</title>
  <style type="text/css">

    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }

    body { background: #000000; }

    #breadcrumb {
      position: fixed; top: 14px; left: 20px;
      font-family: "Courier New", Courier, monospace;
      font-size: 18px; color: #aaaaaa; letter-spacing: 2px;
      z-index: 200; pointer-events: auto;
    }
    #breadcrumb a { color: #33aaee; text-decoration: none; }
    #breadcrumb a:hover { color: #66ccff; }

    #weather-frame {
      position: fixed;
      top: 36px; left: 0;
      width: 100%; height: calc(100% - 36px);
      border: none;
      z-index: 1;
    }

    #cloud-r1 {
      position: fixed;
      right: 12px; top: 60px;
      z-index: 50; pointer-events: none;
      opacity: 0.7;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }

    #cloud-r2 {
      position: fixed;
      right: 12px; top: 140px;
      z-index: 50; pointer-events: none;
      opacity: 0.7;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }

    #clippy-wrap {
      position: fixed; bottom: 24px; right: 28px;
      width: 124px; height: 93px;
      z-index: 999; pointer-events: none;
    }
    #clippy-canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }

  </style>
</head>
<body>

<div id="breadcrumb"><a href="plaza.html">&#8592; plaza</a> &nbsp;/&nbsp; weather</div>

<img id="cloud-r1" src="img/cloud1.png"  alt="" />
<img id="cloud-r2" src="gifs/cloud.gif"  alt="" />

<iframe id="weather-frame"
  src="https://weatherstar.netbymatt.com/"
  title="WeatherStar 4000+">
</iframe>

<div id="clippy-wrap">
  <canvas id="clippy-canvas" width="124" height="93"></canvas>
</div>

<script>
(function() {
  var FW = 124, FH = 93;
  var seq = [], i;
  for (i = 10; i < 26; i++) seq.push([i, 29]);
  for (i = 0;  i < 24; i++) seq.push([i, 30]);

  var canvas = document.getElementById('clippy-canvas');
  var ctx = canvas.getContext('2d'), sheet = null, frame = 0;

  function tick() {
    if (!sheet) return;
    var f = seq[frame % seq.length];
    ctx.clearRect(0, 0, FW, FH);
    ctx.drawImage(sheet, f[0]*FW, f[1]*FH, FW, FH, 0, 0, FW, FH);
    frame++;
  }

  var img = new Image();
  img.onload = function() {
    var oc = document.createElement('canvas');
    oc.width = img.width; oc.height = img.height;
    var oct = oc.getContext('2d');
    oct.drawImage(img, 0, 0);
    var id = oct.getImageData(0, 0, oc.width, oc.height), d = id.data;
    for (var j = 0; j < d.length; j += 4) {
      if (d[j] > 200 && d[j+1] < 60 && d[j+2] > 200) d[j+3] = 0;
    }
    oct.putImageData(id, 0, 0);
    sheet = oc; tick(); setInterval(tick, 130);
  };
  img.src = 'img/clippy.png';
})();
</script>

</body>
</html>
