<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>mikatomorrow</title>
  <style type="text/css">

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background-color: #0e140e;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      display: table;
      width: 100%;
    }

    body:before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .outer {
      display: table-cell;
      vertical-align: middle;
      text-align: center;
    }

    .stage {
      display: inline-block;
      text-align: center;
    }

    /* natural size — adjust width here to taste */
    .cat-img {
      display: block;
      margin: 0 auto 24px auto;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    a.enter {
      display: inline-block;
      background-color: #2ecc2e;
      color: #0e140e;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      text-decoration: none;
      padding: 7px 32px;
    }

    a.enter:hover { background-color: #77ff77; }

  </style>
</head>
<body>
<div class="outer">
  <div class="stage">
    <img src="ascii_cat.PNG" class="cat-img" alt="" />
    <a href="boot.html" class="enter">[ &nbsp;ENTER&nbsp; ]</a>
  </div>
</div>
</body>
</html>
