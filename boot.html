<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mika OS 9</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    /* ============================================================
       STAGES
       ============================================================ */
    .stage {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
    }

    .stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── CRT top-down render curtain ── */
    .render-curtain {
      position: absolute;
      inset: 0;
      background: #000;
      animation: curtainDrop 0.28s steps(18, end) forwards;
      z-index: 50;
      pointer-events: none;
    }

    @keyframes curtainDrop {
      0%   { clip-path: inset(0 0 100% 0); }
      100% { clip-path: inset(100% 0 0 0); }
    }

    /* ============================================================
       IMAGES — absolutely positioned to truly fill the stage
       ============================================================ */
    .stage img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    /* ============================================================
       VIDEO — Stage 3, same full-cover treatment
       ============================================================ */
    #bootvid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

  </style>
</head>
<body>

  <!-- ============================================================
       STAGE 1 — Happy Mac image
       Replace happymac.png with your file.
       ============================================================ -->
  <div id="s1" class="stage active">
    <img src="happymac.png" alt="" />
  </div>

  <!-- ============================================================
       STAGE 2 — Welcome to Mika OS image
       Replace welcome.png with your file.
       ============================================================ -->
  <div id="s2" class="stage">
    <img src="welcome.png" alt="" />
  </div>

  <!-- ============================================================
       STAGE 3 — Startup video
       Replace startup.mp4 with your file.
       Redirects to plaza.html when video ends.
       ============================================================ -->
  <div id="s3" class="stage">
    <video id="bootvid" src="startup.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    function dropCurtain(stageEl) {
      var curtain = document.createElement('div');
      curtain.className = 'render-curtain';
      stageEl.appendChild(curtain);
      setTimeout(function() {
        if (curtain.parentNode) curtain.parentNode.removeChild(curtain);
      }, 320);
    }

    function goTo(fromId, toId, callback) {
      document.getElementById(fromId).classList.remove('active');
      var next = document.getElementById(toId);
      next.classList.add('active');
      dropCurtain(next);
      if (callback) callback();
    }

    window.addEventListener('load', function() {

      // curtain on stage 1 immediately
      dropCurtain(document.getElementById('s1'));

      // stage 1 → stage 2 after 1.4s
      setTimeout(function() {
        goTo('s1', 's2');

        // stage 2 → stage 3 after 2.2s
        setTimeout(function() {
          goTo('s2', 's3', function() {

            var vid = document.getElementById('bootvid');
            vid.play();

            // redirect when video ends
            vid.addEventListener('ended', function() {
              window.location.href = 'plaza.html';
            });

            // 12s safety fallback
            setTimeout(function() {
              window.location.href = 'plaza.html';
            }, 12000);

          });
        }, 2200);

      }, 1400);

    });
  </script>

</body>
</html>
