<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mika OS 9</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    /* ============================================================
       STAGES
       ============================================================ */
    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    .stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ============================================================
       CRT CURTAIN
       Covers the stage in black, then clips away from the top
       downward — revealing content line by line like a CRT.

       inset(top right bottom left):
         0%:   inset(0 0 0 0)      = fully covering (black over everything)
         100%: inset(100% 0 0 0)   = clipped 100% from top = nothing left
       So the top edge of the black curtain moves down,
       revealing content from top to bottom.
       ============================================================ */
    .render-curtain {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 50;
      pointer-events: none;
      animation: curtainDrop 0.3s steps(20, end) forwards;
    }

    @keyframes curtainDrop {
      0%   { clip-path: inset(0 0 0 0); }
      100% { clip-path: inset(100% 0 0 0); }
    }

    /* ============================================================
       STAGE BACKGROUNDS
       ============================================================ */
    #s1, #s2 {
      background-color: #888888;
      background-image:
        linear-gradient(45deg, #888 25%, transparent 25%),
        linear-gradient(-45deg, #888 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #888 75%),
        linear-gradient(-45deg, transparent 75%, #888 75%);
      background-size: 2px 2px;
      background-position: 0 0, 0 1px, 1px -1px, -1px 0;
    }

    #s3 {
      background-color: ##9A9ACC;
      background-image:
        linear-gradient(45deg, #7788aa 25%, transparent 25%),
        linear-gradient(-45deg, #7788aa 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #7788aa 75%),
        linear-gradient(-45deg, transparent 75%, #7788aa 75%);
      background-size: 2px 2px;
      background-position: 0 0, 0 1px, 1px -1px, -1px 0;
    }

    /* ============================================================
       IMAGES — natural size, centered by flex
       ============================================================ */
    .stage img {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* ============================================================
       VIDEO — natural size, centered by flex
       ============================================================ */
    #bootvid {
      display: block;
    }

  </style>
</head>
<body>

  <!-- STAGE 1 — Happy Mac -->
  <div id="s1" class="stage active">
    <img src="welcome.png" alt="" />
  </div>

  <!-- STAGE 2 — Welcome to Mika OS -->
  <div id="s2" class="stage">
    <img src="mikaos.png" alt="" />
  </div>

  <!-- STAGE 3 — Startup video -->
  <div id="s3" class="stage">
    <video id="bootvid" src="startup.mov" muted playsinline preload="auto"></video>
  </div>

  <script>
    function dropCurtain(stageEl) {
      var curtain = document.createElement('div');
      curtain.className = 'render-curtain';
      stageEl.appendChild(curtain);
      setTimeout(function() {
        if (curtain.parentNode) curtain.parentNode.removeChild(curtain);
      }, 350);
    }

    function goTo(fromId, toId, callback) {
      document.getElementById(fromId).classList.remove('active');
      var next = document.getElementById(toId);
      next.classList.add('active');
      dropCurtain(next);
      if (callback) callback();
    }

    window.addEventListener('load', function() {

      // curtain on stage 1 immediately on load
      dropCurtain(document.getElementById('s1'));

      // stage 1 → stage 2 after 1.4s
      setTimeout(function() {
        goTo('s1', 's2');

        // stage 2 → stage 3 after 2.2s
        setTimeout(function() {
          goTo('s2', 's3', function() {
            var vid = document.getElementById('bootvid');
            vid.play();

            // redirect when video ends
            vid.addEventListener('ended', function() {
              window.location.href = 'plaza.html';
            });

            // 12s safety fallback
            setTimeout(function() {
              window.location.href = 'plaza.html';
            }, 12000);
          });
        }, 2200);

      }, 1400);

    });
  </script>

</body>
</html>
