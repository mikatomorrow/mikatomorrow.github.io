<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mika OS 9</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
    }

    /* ============================================================
       STAGES
       ============================================================ */
    .stage {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }

    .stage.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── CRT top-down render curtain ──
       Slides off top-to-bottom in 18 steps to mimic
       a CRT electron gun drawing the screen.           */
    .render-curtain {
      position: absolute;
      inset: 0;
      background: #000;
      animation: curtainDrop 0.28s steps(18, end) forwards;
      z-index: 50;
      pointer-events: none;
    }

    @keyframes curtainDrop {
      0%   { clip-path: inset(0 0 100% 0); }  /* black covers top    */
      100% { clip-path: inset(100% 0 0 0); }  /* black exits bottom  */
    }

    /* ============================================================
       STAGE BACKGROUNDS
       ============================================================ */

    /* Stage 1 & 2 — classic grey dither */
    #s1, #s2 {
      background-color: #999999;
      background-image:
        linear-gradient(45deg, #888 25%, transparent 25%),
        linear-gradient(-45deg, #888 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #888 75%),
        linear-gradient(-45deg, transparent 75%, #888 75%);
      background-size: 2px 2px;
      background-position: 0 0, 0 1px, 1px -1px, -1px 0;
    }

    /* Stage 3 — lavender/periwinkle */
    #s3 {
      background-color: #8899bb;
      background-image:
        linear-gradient(45deg, #7788aa 25%, transparent 25%),
        linear-gradient(-45deg, #7788aa 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #7788aa 75%),
        linear-gradient(-45deg, transparent 75%, #7788aa 75%);
      background-size: 2px 2px;
      background-position: 0 0, 0 1px, 1px -1px, -1px 0;
    }

    /* ============================================================
       IMAGES
       ============================================================ */

    /* Stage 1 — happy mac image, pixel-perfect, no scaling blur */
#s1 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

#s2 img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}

    /* ============================================================
       VIDEO — Stage 3
       fills the full stage, no letterboxing
       ============================================================ */
    #bootvid {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

  </style>
</head>
<body>

  <!-- ============================================================
       STAGE 1 — Happy Mac image
       Replace happymac.png with your file.
       ============================================================ -->
  <div id="s1" class="stage active">
    <img src="welcome.png" alt="" />
  </div>

  <!-- ============================================================
       STAGE 2 — Welcome dialog image
       Replace welcome.png with your file.
       ============================================================ -->
  <div id="s2" class="stage">
    <img src="mikaos.png" alt="" />
  </div>

  <!-- ============================================================
       STAGE 3 — Startup video
       Replace startup.mp4 with your file.
       Redirect happens when video ends — no hardcoded delay.
       ============================================================ -->
  <div id="s3" class="stage">
    <video id="bootvid" src="startup.mp4" muted playsinline preload="auto"></video>
  </div>

  <script>
    // ── curtain drop ─────────────────────────────────────────────
    // Adds a black overlay that animates off top-to-bottom,
    // simulating an old CRT drawing the screen line by line.
    function dropCurtain(stageEl) {
      var curtain = document.createElement('div');
      curtain.className = 'render-curtain';
      stageEl.appendChild(curtain);
      setTimeout(function() {
        if (curtain.parentNode) curtain.parentNode.removeChild(curtain);
      }, 320);
    }

    // ── transition ───────────────────────────────────────────────
    function goTo(fromId, toId, callback) {
      document.getElementById(fromId).classList.remove('active');
      var next = document.getElementById(toId);
      next.classList.add('active');
      dropCurtain(next);
      if (callback) callback();
    }

    // ── boot on load ─────────────────────────────────────────────
    window.addEventListener('load', function() {

      // curtain on stage 1 immediately
      dropCurtain(document.getElementById('s1'));

      // stage 1 → stage 2 after 1.4s
      setTimeout(function() {
        goTo('s1', 's2');

        // stage 2 → stage 3 after 2.2s
        setTimeout(function() {
          goTo('s2', 's3', function() {
            // play video the moment stage 3 is visible
            var vid = document.getElementById('bootvid');
            vid.play();

            // redirect to plaza when video ends
            vid.addEventListener('ended', function() {
              window.location.href = 'plaza.html';
            });

            // safety fallback: redirect after 12s if video never fires 'ended'
            setTimeout(function() {
              window.location.href = 'plaza.html';
            }, 12000);
          });
        }, 2200);

      }, 1400);

    });
  </script>

</body>
</html>
